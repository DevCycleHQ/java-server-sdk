name: Java Unit Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run build with Gradle Wrapper
        run: ./gradlew build
      - name: Test with Gradle Wrapper
        run: ./gradlew test
